name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    # Runner image with Xcode 27 (GT Sync targets macOS 26 and is built with Xcode 27).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Engine tests (GTSyncCore)
        run: swift test --package-path GTSyncCore

      - name: App tests
        run: xcodebuild test -project GTSync.xcodeproj -scheme GTSync -destination 'platform=macOS'
